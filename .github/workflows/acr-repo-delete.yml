# =============================================================================
# acr-repo-delete (azure-app-svc)
#
# DESTRUCTIVE. Deletes an entire repository -- every tag and every manifest --
# from an Azure Container Registry.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: acr-repo-delete (azure-app-svc)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Image namespace. With artifactId this forms the repository <environment>/<artifactId>.'
        required: true
        type: choice
        options:
          - dev
          - lab
      registry_name:
        description: 'Name of the EXISTING Azure Container Registry to delete from (not the login server).'
        required: true
        type: choice
        options:
          - crrgomesdev01
          - crrgomeslab02
      confirm:
        description: >
          EVERY TAG AND MANIFEST IN THE REPOSITORY IS DELETED PERMANENTLY.
          There is no soft-delete and no recycle bin. Push anything you care
          about elsewhere first. Check this box to confirm.
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: acr-repo-delete
  cancel-in-progress: false

jobs:
  delete:
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-repo-delete.yml@v0
    with:
      environment: ${{ inputs.environment }}
      registry-name: ${{ inputs.registry_name }}
      artifact-id: azure-app-svc
      confirm: ${{ inputs.confirm && format('DELETE REPO {0} {1}/azure-app-svc', inputs.registry_name, inputs.environment) || '' }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
