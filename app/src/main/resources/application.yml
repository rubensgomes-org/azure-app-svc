############################ default ###########################################
## default
spring:
  application:
    # Replaced at grale processResources time using property from
    # "app/gradle.properties" -- see the Resource Filtering
    name: "@artifactId@"
  # disable docker compose up when running ./gradlew bootRun
  docker:
    compose:
      lifecycle-management: none
  # timeout to handle sigterm (default is 30s)
  lifecycle:
    timeout-per-shutdown-phase: 5s
  # color the logs when possible
  output:
    ansi:
      enabled: DETECT

## --------------- >>> logging <<< --------------------------------------------
logging:
  group:
    tomcat: "org.apache.catalina,org.apache.coyote,org.apache.tomcat"
  level:
    com.rubensgomes.azure.appsvc: "trace"
    root: "error"
    tomcat: "warn"
    web: "warn"

## --------------- >>> server <<< ---------------------------------------------
server:
  error:
    include-message: "always"
  port: 8080
  servlet:
    context-path: "/"
  shutdown: "graceful"

## --------------- >>> openapi <<< --------------------------------------------
## Bound by "OpenApiProperties" and used to build the "info" section of the
## generated OpenAPI document.
openapi:
  description: "@description@"
  title: "@title@"
  version: "@version@"

## --------------- >>> springdoc <<< ------------------------------------------
## Off by default
springdoc:
  api-docs:
    enabled: false
  paths-to-exclude: "/error"
  swagger-ui:
    enabled: false
